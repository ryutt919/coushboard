# 이 파일을 .github/workflows/ci.yml 로 복사하면 CI가 켜진다. (gh 토큰에 workflow 권한이 없어 자동 푸시하지 못했다)
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # verify가 lint -> typecheck -> H1~H4 -> H6 -> supabase start/db reset/test db -> H8 -> H9 -> build -> H5를 순서대로 실행한다.
      - run: npm run verify
