<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>쿠팡 지출 대시보드</title><link rel="stylesheet" href="ui.css">
<body><div class="wrap">
<h1>쿠팡 지출 대시보드</h1>
<div class="card row" style="align-items:center">
 <select id="period"></select><input id="from" type="date"><span>~</span><input id="to" type="date">
 <select id="status"><option value="ok">구매 확정분</option><option value="all">전체</option><option value="ret">반품·취소만</option></select>
 <span style="flex:1"></span>
 <button id="imp">CSV 가져오기</button><input id="file" type="file" accept=".csv" hidden>
 <button id="exp">JSON 내보내기</button><button id="expcsv">CSV 내보내기</button>
</div>
<div id="msg" class="muted"></div>
<div id="main"></div>
</div><script type="module" src="dashboard.js"></script></body></html>
